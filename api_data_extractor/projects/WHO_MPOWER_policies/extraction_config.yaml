# WHO MPOWER, all indicators, EU and OECD countries, report years 2022 and 2024.
# Generated from extraction_plan.json (plan_id WHO_MPOWER_policies). Validate with:
#   python -m src.main validate --config projects/WHO_MPOWER_policies/extraction_config.yaml
schema_version: "1.0"

project:
  name: WHO_MPOWER_policies
  description: >-
    All 33 WHO MPOWER tables and the 22 P and E compliance scores for the 43 EU and
    OECD countries, report years 2022 and 2024, with age-standardised tobacco use
    prevalence for context.
  version: "1.0.0"
  created: 2026-11-22
  extraction_plan: extraction_plan.json

sources:
  - id: who_gho
    provider: World Health Organization
    api_name: Global Health Observatory OData API
    api_type: odata
    connector: who_gho
    base_url: https://ghoapi.azureedge.net/api
    documentation_url: https://www.who.int/data/gho/info/gho-odata-api
    authentication:
      method: none
    request:
      timeout_seconds: 90
      max_retries: 3
      backoff_seconds: 2
      min_interval_seconds: 0.5

extractions:
  - id: mpower_tables
    source: who_gho
    countries: [AUT, BEL, BGR, HRV, CYP, CZE, DNK, EST, FIN, FRA, DEU, GRC, HUN, IRL, ITA, LVA, LTU, LUX, MLT, NLD, POL, PRT, ROU, SVK, SVN, ESP, SWE, AUS, CAN, CHL, COL, CRI, ISL, ISR, JPN, KOR, MEX, NZL, NOR, CHE, TUR, GBR, USA]
    start_year: 2022
    end_year: 2024
    frequency: any
    filters:
      SpatialDimType: COUNTRY
    indicators:
      - code: TOBACCO_MPOWER_E1_DIRECTADBANS
        name: "Tobacco Enforce bans: E1 direct advertising"
        category: "E - Enforce"
        measurement_scale: text
        unit: "Mixed by question (Yes/No, categories, percentages, counts, prices): see the TOBACCO_INDICATOR dimension"
      - code: TOBACCO_MPOWER_E2_INDIRECTADBANS
        name: "Tobacco Enforce bans: E2 indirect advertising"
        category: "E - Enforce"
        measurement_scale: text
        unit: "Mixed by question (Yes/No, categories, percentages, counts, prices): see the TOBACCO_INDICATOR dimension"
      - code: TOBACCO_MPOWER_E3_INDIRECTADBANSPLUS
        name: "Tobacco Enforce bans: E3 indirect advertising, additional bans"
        category: "E - Enforce"
        measurement_scale: text
        unit: "Mixed by question (Yes/No, categories, percentages, counts, prices): see the TOBACCO_INDICATOR dimension"
      - code: TOBACCO_MPOWER_M1_PREVALENCE
        name: "Tobacco Monitor: population-based national surveys, tobacco use and smoking, prevalence"
        category: "M - Monitor"
        measurement_scale: text
        unit: "Mixed by question (Yes/No, categories, percentages, counts, prices): see the TOBACCO_INDICATOR dimension"
      - code: TOBACCO_MPOWER_M1_TOBACCOUSESMOKING
        name: "Tobacco Monitor: population-based national surveys, tobacco use and smoking"
        category: "M - Monitor"
        measurement_scale: text
        unit: "Mixed by question (Yes/No, categories, percentages, counts, prices): see the TOBACCO_INDICATOR dimension"
      - code: TOBACCO_MPOWER_M2_PREVALENCE
        name: "Tobacco Monitor: population-based national surveys, smokeless tobacco or e-cigarettes, prevalence"
        category: "M - Monitor"
        measurement_scale: text
        unit: "Mixed by question (Yes/No, categories, percentages, counts, prices): see the TOBACCO_INDICATOR dimension"
      - code: TOBACCO_MPOWER_M2_SMOKELESSECIGARETTES
        name: "Tobacco Monitor: population-based national surveys, smokeless tobacco or e-cigarettes"
        category: "M - Monitor"
        measurement_scale: text
        unit: "Mixed by question (Yes/No, categories, percentages, counts, prices): see the TOBACCO_INDICATOR dimension"
      - code: TOBACCO_MPOWER_M3_PREVALENCE
        name: "Tobacco Monitor: school-based national surveys, tobacco use, tobacco smoking, and cigarette smoking, prevalence"
        category: "M - Monitor"
        measurement_scale: text
        unit: "Mixed by question (Yes/No, categories, percentages, counts, prices): see the TOBACCO_INDICATOR dimension"
      - code: TOBACCO_MPOWER_M3_TOBACCOUSESMOKINGSCHOOL
        name: "Tobacco Monitor: school-based national surveys, tobacco use, tobacco smoking, and cigarette smoking"
        category: "M - Monitor"
        measurement_scale: text
        unit: "Mixed by question (Yes/No, categories, percentages, counts, prices): see the TOBACCO_INDICATOR dimension"
      - code: TOBACCO_MPOWER_M4_PREVALENCE
        name: "Tobacco Monitor: school-based national surveys, smokeless tobacco or e-cigarettes, prevalence"
        category: "M - Monitor"
        measurement_scale: text
        unit: "Mixed by question (Yes/No, categories, percentages, counts, prices): see the TOBACCO_INDICATOR dimension"
      - code: TOBACCO_MPOWER_M4_SMOKELESSECIGARETTESSCHOOL
        name: "Tobacco Monitor: school-based national surveys, smokeless tobacco or e-cigarettes"
        category: "M - Monitor"
        measurement_scale: text
        unit: "Mixed by question (Yes/No, categories, percentages, counts, prices): see the TOBACCO_INDICATOR dimension"
      - code: TOBACCO_MPOWER_NTCP

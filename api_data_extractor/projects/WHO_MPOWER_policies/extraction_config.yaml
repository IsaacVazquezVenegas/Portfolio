      - code: TOBACCO_MPOWER_W1C_TOBACCOSMOKELESS
        name: "Tobacco Warning: W1c smokeless tobacco packaging health warnings"
        category: "W - Warn"
        measurement_scale: text
        unit: "Mixed by question (Yes/No, categories, percentages, counts, prices): see the TOBACCO_INDICATOR dimension"
      - code: TOBACCO_MPOWER_W2A_CIGARETTES
        name: "Tobacco Warning: W2a cigarette packaging health warnings, other characteristics"
        category: "W - Warn"
        measurement_scale: text

processing:
  country_codes: iso3
  numeric_values: source_numeric_only
  standardise_periods: true
  missing_values:
    treatment: keep
    markers:
    - . . .
  deduplicate: true
  wide_panel: true
validation:
  check_duplicates: true
  check_missing: true
  check_units: true
  check_indicator_definitions: true
  check_coverage: true
  min_records: 1
  max_missing_share: 0.9
  fail_on_request_error: true
output:
  directory: output
  folder_name: '{project}_{timestamp}'
  overwrite: false
  formats:
  - csv
  - xlsx
  - json
  data_dictionary: true
  readme: true

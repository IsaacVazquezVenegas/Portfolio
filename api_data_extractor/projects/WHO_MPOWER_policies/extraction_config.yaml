    indicators:
      - code: M_Est_tob_curr_std
        name: "Estimate of current tobacco use prevalence (%) (age-standardized)"
        category: "Context - prevalence"
        measurement_scale: ratio
        definition: "Modelled estimate of the percentage of the population aged 15+ currently using any tobacco product, age-standardised."
        unit: "% of population aged 15+"

processing:
  country_codes: iso3
  numeric_values: source_numeric_only   # answers and levels stay as text (value_text)
  standardise_periods: true
  missing_values:
    treatment: keep
    markers: []                         # '. . .', '—' and 'Not applicable' are kept as published
  deduplicate: true
  wide_panel: true

validation:
  check_duplicates: true
  check_missing: true
  check_units: true
  check_indicator_definitions: true
  check_coverage: true
  min_records: 1
  max_missing_share: 0.9
  fail_on_request_error: true

output:
  directory: output
  folder_name: "{project}_{timestamp}"
  overwrite: false
  formats: [csv, xlsx, json]
  data_dictionary: true
  readme: true

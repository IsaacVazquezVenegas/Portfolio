      - code: TOBACCO_MPOWER_R_TAXSTRUCTURE
        name: "Tobacco Raise taxes: Tobacco tax structure"
        category: "R - Raise taxes"
        measurement_scale: text
        unit: "Mixed by question (Yes/No, categories, percentages, counts, prices): see the TOBACCO_INDICATOR dimension"
      - code: TOBACCO_MPOWER_W1A_CIGARETTES
        name: "Tobacco Warning: W1a cigarette packaging health warnings"
        category: "W - Warn"
        measurement_scale: text
        unit: "Mixed by question (Yes/No, categories, percentages, counts, prices): see the TOBACCO_INDICATOR dimension"

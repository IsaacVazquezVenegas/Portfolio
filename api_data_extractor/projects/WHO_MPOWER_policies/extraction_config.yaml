      - code: TOBACCO_MPOWER_R_AFFORDABILITY
        name: "Tobacco Raise taxes: Affordability"
        category: "R - Raise taxes"
        measurement_scale: text
        unit: "Mixed by question (Yes/No, categories, percentages, counts, prices): see the TOBACCO_INDICATOR dimension"
      - code: TOBACCO_MPOWER_R_EARMARKED
        name: "Tobacco Raise taxes:  Reported use of earmarked tobacco taxes"
        category: "R - Raise taxes"
        measurement_scale: text
        unit: "Mixed by question (Yes/No, categories, percentages, counts, prices): see the TOBACCO_INDICATOR dimension"
      - code: TOBACCO_MPOWER_R_INFLATIONADJUSTEDPRICES

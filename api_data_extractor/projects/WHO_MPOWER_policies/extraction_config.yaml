  - id: prevalence_2022
    source: who_gho
    countries: [AUT, BEL, BGR, HRV, CYP, CZE, DNK, EST, FIN, FRA, DEU, GRC, HUN, IRL, ITA, LVA, LTU, LUX, MLT, NLD, POL, PRT, ROU, SVK, SVN, ESP, SWE, AUS, CAN, CHL, COL, CRI, ISL, ISR, JPN, KOR, MEX, NZL, NOR, CHE, TUR, GBR, USA]
    start_year: 2022
    end_year: 2022
    frequency: any
    filters:
      SpatialDimType: COUNTRY
    indicators:
      - code: M_Est_tob_curr_std
        name: "Estimate of current tobacco use prevalence (%) (age-standardized)"
        category: "Context - prevalence"
        measurement_scale: ratio
        definition: "Modelled estimate of the percentage of the population aged 15+ currently using any tobacco product, age-standardised."
        unit: "% of population aged 15+"

  - id: prevalence_2024
    source: who_gho
    countries: [AUT, BEL, BGR, HRV, CYP, CZE, DNK, EST, FIN, FRA, DEU, GRC, HUN, IRL, ITA, LVA, LTU, LUX, MLT, NLD, POL, PRT, ROU, SVK, SVN, ESP, SWE, AUS, CAN, CHL, COL, CRI, ISL, ISR, JPN, KOR, MEX, NZL, NOR, CHE, TUR, GBR, USA]

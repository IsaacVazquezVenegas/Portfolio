        category: "NTCP"
        measurement_scale: text
        unit: "Mixed by question (Yes/No, categories, percentages, counts, prices): see the TOBACCO_INDICATOR dimension"
      - code: TOBACCO_MPOWER_O1_TREATMENTSUPPORT
        name: "Tobacco Offer help: O1 Support for treatment of tobacco dependence / Availability of smoking cessation support"
        category: "Overview (composites)"
        measurement_scale: text
        unit: "Mixed by question (Yes/No, categories, percentages, counts, prices): see the TOBACCO_INDICATOR dimension"
      - code: TOBACCO_MPOWER_O2_MEDICATIONAVAILABILITY
        name: "Tobacco Offer help: O2 Availability of tobacco cessation medications"
        category: "Overview (composites)"
        measurement_scale: text
        unit: "Mixed by question (Yes/No, categories, percentages, counts, prices): see the TOBACCO_INDICATOR dimension"
      - code: TOBACCO_MPOWER_OVERVIEW
